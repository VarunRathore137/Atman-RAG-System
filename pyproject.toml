[project]
name = "atman-rag-docqa"
version = "0.1.0"
description = "Production-grade Local RAG Document QA System for Atman Cloud Consultants"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11.4",
    "pymupdf>=1.24.10",
    "pypdf>=5.0.0",
    "sentence-transformers>=3.3.1",
    "chromadb>=0.5.23",
    "groq>=0.11.0",
    "ollama>=0.3.3",
    "google-genai>=2.11.0",
    "streamlit>=1.39.0",
    "pydantic>=2.9.2",
    "python-dotenv>=1.0.1",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "rich>=13.9.2",
    "tabulate>=0.9.0",
    "torchvision>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/chunking",
    "src/evaluation",
    "src/generation",
    "src/ingestion",
    "src/retrieval",
    "src/ui",
    "src/vector_store",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
